<!doctype html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>رزرو نوبت پزشکی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Persian Font: Vazirmatn -->
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />

  <style>
    body {
      font-family: Vazirmatn, sans-serif;
      direction: rtl;
      background: #121212;
      color: #e6e6e6;
      padding: 20px;
      margin: 0;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
      color: #fff;
    }

    .container {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 0 16px rgba(0,0,0,0.4);
      max-width: 480px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 14px;
      color: #bdbdbd;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      outline: none;
      transition: 0.2s;
      box-sizing: border-box;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #6c63ff;
      background: #333;
    }

    button.primary {
      margin-top: 22px;
      padding: 12px;
      width: 100%;
      background: #6c63ff;
      border: none;
      color: white;
      font-size: 17px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button.primary:hover {
      background: #5a53e6;
    }

    #status {
      margin-top: 16px;
      font-size: 15px;
      text-align: center;
      color: #90caf9;
    }

    #user-info {
      text-align: center;
      margin-bottom: 10px;
      font-size: 16px;
      color: #eeeeee;
    }

    /* --- Time buttons --- */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .time-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
      user-select: none;
      text-align: center;
    }

    .time-btn:hover {
      border-color: #6c63ff;
      background: #333;
    }

    .time-btn.active {
      background: rgba(108, 99, 255, 0.25);
      border-color: #6c63ff;
      box-shadow: 0 0 0 2px rgba(108,99,255,0.2) inset;
    }

    .hint {
      font-size: 12px;
      color: #9e9e9e;
      margin-top: 6px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>رزرو نوبت</h2>
    <div id="user-info"></div>

    <form id="appointment-form">

      <label for="full_name">نام و نام خانوادگی</label>
      <input type="text" id="full_name" name="full_name" required />

      <label for="national_id">کد ملی</label>
      <input type="text" id="national_id" name="national_id" inputmode="numeric" maxlength="10" required />
      <div class="hint">۱۰ رقم، فقط عدد</div>

      <label for="phone">شماره تماس</label>
      <input type="tel" id="phone" name="phone" inputmode="tel" placeholder="09xxxxxxxxx" required />
      <div class="hint">مثال: 09123456789</div>

      <label for="doctor">پزشک</label>
      <select id="doctor" name="doctor" required>
        <!-- گزینه‌ها با JS پر می‌شوند -->
      </select>

      <label for="date">تاریخ نوبت (شمسی)</label>
      <input
        type="text"
        id="date"
        name="date"
        placeholder="مثلاً 1403/10/25"
        autocomplete="off"
        required
      />
      <div class="hint">فعلاً تاریخ را شمسی وارد کنید (YYYY/MM/DD). اگر خواستی تقویم شمسی دکمه‌ای هم اضافه می‌کنم.</div>

      <label>ساعت نوبت</label>
      <div class="time-grid" id="time-grid">
        <div class="time-btn" data-hour="10">ساعت ۱۰</div>
        <div class="time-btn" data-hour="11">ساعت ۱۱</div>
        <div class="time-btn" data-hour="12">ساعت ۱۲</div>
        <div class="time-btn" data-hour="13">ساعت ۱۳</div>
      </div>
      <div class="hint">یکی از ساعت‌ها را انتخاب کنید.</div>

      <!-- input مخفی برای اینکه فرم required بماند و value به payload برود -->
      <input type="hidden" id="time" name="time" required />

      <label for="note">توضیحات / علت مراجعه (اختیاری)</label>
      <textarea id="note" name="note" rows="3"></textarea>

      <button class="primary" type="submit">ثبت نوبت</button>
    </form>

    <div id="status"></div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const MAKE_WEBHOOK_URL = 'https://hook.eu2.make.com/hhfl8sza59snc3al2zd9hygddpidleku';

  const DOCTORS = {
    "dr_a": "دکتر A - مغز و اعصاب",
    "dr_b": "دکتر B - قلب و عروق",
    "dr_c": "دکتر C - داخلی",
  };

  const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
  const userInfoDiv = document.getElementById("user-info");
  const doctorSelect = document.getElementById("doctor");
  const form = document.getElementById("appointment-form");
  const statusDiv = document.getElementById("status");

  const timeGrid = document.getElementById("time-grid");
  const hiddenTime = document.getElementById("time");

  // نمایش نام کاربر
  if (user) {
    userInfoDiv.textContent = `سلام ${user.first_name || ""} 👋`;
  } else {
    userInfoDiv.textContent = "در حال دریافت اطلاعات کاربر...";
  }

  // پر کردن لیست دکترها
  const urlParams = new URLSearchParams(window.location.search);
  const doctorIdFromUrl = urlParams.get("doctor_id");

  if (doctorIdFromUrl) {
    doctorSelect.innerHTML = "";
    const label = DOCTORS[doctorIdFromUrl] || doctorIdFromUrl;
    const opt = document.createElement("option");
    opt.value = doctorIdFromUrl;
    opt.textContent = label;
    doctorSelect.appendChild(opt);
    doctorSelect.disabled = true;
  } else {
    doctorSelect.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "انتخاب کنید...";
    doctorSelect.appendChild(placeholder);

    Object.entries(DOCTORS).forEach(([id, label]) => {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = label;
      doctorSelect.appendChild(opt);
    });
  }

  // انتخاب ساعت با دکمه‌ها
  timeGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".time-btn");
    if (!btn) return;

    // active UI
    [...timeGrid.querySelectorAll(".time-btn")].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    // set hidden value (همون چیزی که به Make می‌فرستی)
    hiddenTime.value = btn.dataset.hour; // "10" | "11" | "12" | "13"
  });

  // اعتبارسنجی ساده تاریخ شمسی YYYY/MM/DD
  function isValidJalaliTextDate(s) {
    // فقط بررسی شکلی؛ تبدیل/اعتبار واقعی روزهای ماه رو بعداً می‌تونیم دقیق‌تر کنیم
    const m = /^(\d{4})\/(\d{2})\/(\d{2})$/.exec(s);
    if (!m) return false;
    const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
    if (y < 1300 || y > 1500) return false;
    if (mo < 1 || mo > 12) return false;
    if (d < 1 || d > 31) return false;
    return true;
  }

  function isValidNationalId(s) {
    return /^\d{10}$/.test(s);
  }

  function isValidPhone(s) {
    return /^09\d{9}$/.test(s);
  }

  // ارسال فرم
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    if (!user) {
      statusDiv.textContent = "خطا: اطلاعات کاربر تلگرام دریافت نشد.";
      return;
    }

    if (doctorSelect.value === "") {
      statusDiv.textContent = "لطفاً پزشک مورد نظر را انتخاب کنید.";
      return;
    }

    if (!isValidNationalId(form.national_id.value.trim())) {
      statusDiv.textContent = "کد ملی معتبر نیست (۱۰ رقم عددی).";
      return;
    }

    if (!isValidPhone(form.phone.value.trim())) {
      statusDiv.textContent = "شماره تماس معتبر نیست (مثال: 09123456789).";
      return;
    }

    const jalaliDate = form.date.value.trim();
    if (!isValidJalaliTextDate(jalaliDate)) {
      statusDiv.textContent = "تاریخ شمسی معتبر نیست (مثال: 1403/10/25).";
      return;
    }

    if (!hiddenTime.value) {
      statusDiv.textContent = "لطفاً ساعت نوبت را انتخاب کنید.";
      return;
    }

    const payload = {
      telegram_user: {
        id: user.id,
        username: user.username,
        first_name: user.first_name,
        last_name: user.last_name
      },
      patient: {
        full_name: form.full_name.value,
        national_id: form.national_id.value,
        phone: form.phone.value
      },
      appointment: {
        doctor_id: doctorSelect.value,
        doctor_name: DOCTORS[doctorSelect.value],
        date: jalaliDate,         // شمسی
        time: hiddenTime.value,   // "10"|"11"|"12"|"13"
        note: form.note.value
      },
      initData: tg.initData
    };

    statusDiv.textContent = "در حال ارسال نوبت به سیستم...";

    try {
      const response = await fetch(MAKE_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        statusDiv.textContent = "✅ درخواست نوبت با موفقیت ارسال شد.";
        tg.HapticFeedback.notificationOccurred('success');
        setTimeout(() => tg.close(), 1500);
      } else {
        statusDiv.textContent = `❌ خطا در سیستم رزرو. کد خطا: ${response.status}`;
        tg.HapticFeedback.notificationOccurred('error');
      }
    } catch (err) {
      console.error("Fetch Error:", err);
      statusDiv.textContent = "❌ خطای اتصال شبکه. لطفاً مجدداً تلاش کنید.";
      tg.HapticFeedback.notificationOccurred('error');
    }
  });
</script>
</body>
</html>
