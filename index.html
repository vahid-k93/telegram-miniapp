<!doctype html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>رزرو نوبت پزشکی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
  <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

  <style>
    body {
      font-family: Vazirmatn, sans-serif;
      direction: rtl;
      background: #121212;
      color: #e6e6e6;
      padding: 20px;
      margin: 0;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
      color: #fff;
    }

    .container {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 0 16px rgba(0,0,0,0.4);
      max-width: 480px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 14px;
      color: #bdbdbd;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      outline: none;
      transition: 0.2s;
      box-sizing: border-box;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #6c63ff;
      background: #333;
    }

    button.primary {
      margin-top: 22px;
      padding: 12px;
      width: 100%;
      background: #6c63ff;
      border: none;
      color: white;
      font-size: 17px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button.primary:hover {
      background: #5a53e6;
    }

    button.primary:disabled {
        background: #444;
        cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      font-size: 15px;
      text-align: center;
      color: #90caf9;
      line-height: 1.6;
    }

    #user-info {
      text-align: center;
      margin-bottom: 10px;
      font-size: 16px;
      color: #eeeeee;
    }

    .hint {
      font-size: 12px;
      color: #9e9e9e;
      margin-top: 6px;
      line-height: 1.6;
    }

    /* --- Time buttons --- */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .time-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
      user-select: none;
      text-align: center;
    }

    .time-btn:hover {
      border-color: #6c63ff;
      background: #333;
    }

    .time-btn.active {
      background: rgba(108, 99, 255, 0.25);
      border-color: #6c63ff;
      box-shadow: 0 0 0 2px rgba(108,99,255,0.2) inset;
    }

    /* استایل دکمه‌های غیرفعال (پر شده) */
    .time-btn.disabled {
        background: #3a1c1c; /* قرمز تیره */
        border-color: #552222;
        color: #777;
        cursor: not-allowed;
        pointer-events: none; /* غیر قابل کلیک */
        text-decoration: line-through;
    }

    .loading-text {
        text-align: center;
        color: #ffa726;
        font-size: 14px;
        padding: 10px;
    }

    /* Persian datepicker tweaks */
    .datepicker-plot-area {
      font-family: Vazirmatn, sans-serif !important;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>رزرو نوبت</h2>
    <div id="user-info"></div>

    <form id="appointment-form">

      <label for="full_name">نام و نام خانوادگی</label>
      <input type="text" id="full_name" name="full_name" required />

      <label for="national_id">کد ملی</label>
      <input type="text" id="national_id" name="national_id" inputmode="numeric" maxlength="10" required />
      <div class="hint">۱۰ رقم، فقط عدد</div>

      <label for="phone">شماره تماس</label>
      <input type="tel" id="phone" name="phone" inputmode="tel" placeholder="09xxxxxxxxx" required />
      <div class="hint">مثال: 09123456789</div>

      <label for="doctor">پزشک</label>
      <select id="doctor" name="doctor" required>
        </select>

      <label for="date">تاریخ نوبت (شمسی)</label>
      <input
        type="text"
        id="date"
        name="date"
        placeholder="انتخاب تاریخ"
        autocomplete="off"
        required
      />
      <div class="hint">روی فیلد تاریخ بزنید تا تقویم شمسی باز شود.</div>

      <label>ساعت نوبت</label>
      <div class="time-grid" id="time-grid">
         <div style="grid-column: span 2; text-align: center; color: #777;">
            ابتدا پزشک و تاریخ را انتخاب کنید.
         </div>
      </div>
      <div class="hint">ساعت‌های قرمز رنگ قبلاً رزرو شده‌اند.</div>

      <input type="hidden" id="time" name="time" required />

      <label for="note">توضیحات / علت مراجعه (اختیاری)</label>
      <textarea id="note" name="note" rows="3"></textarea>

      <button class="primary" type="submit" id="submit-btn">ثبت نوبت</button>
    </form>

    <div id="status"></div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  // ============================================
  // ⚠️ تنظیمات آدرس‌های وب‌هوک Make ⚠️
  // ============================================

  // ۱. وب‌هوک ثبت نهایی نوبت (سناریوی Registration)
  const MAKE_WEBHOOK_URL = 'https://hook.eu2.make.com/hhfl8sza59snc3al2zd9hygddpidleku';

  // ۲. وب‌هوک دریافت ساعت‌های خالی (سناریوی Get Slots) - آدرس جدید رو اینجا بذار
  const GET_SLOTS_URL = 'https://hook.us1.make.com/YOUR_GET_SLOTS_WEBHOOK_URL'; 

  // ============================================

  const DOCTORS = {
    "dr_a": "دکتر A - مغز و اعصاب",
    "dr_b": "دکتر B - قلب و عروق",
    "dr_c": "دکتر C - داخلی",
  };

  // --- DOM ---
  const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
  const userInfoDiv = document.getElementById("user-info");
  const doctorSelect = document.getElementById("doctor");
  const form = document.getElementById("appointment-form");
  const statusDiv = document.getElementById("status");
  const timeGrid = document.getElementById("time-grid");
  const hiddenTime = document.getElementById("time");
  const dateInput = document.getElementById("date");

  // --- نمایش نام کاربر ---
  if (user) {
    userInfoDiv.textContent = `سلام ${user.first_name || ""} 👋`;
  } else {
    userInfoDiv.textContent = "در حال دریافت اطلاعات کاربر...";
  }

  // --- پر کردن لیست دکترها ---
  const urlParams = new URLSearchParams(window.location.search);
  const doctorIdFromUrl = urlParams.get("doctor_id");

  if (doctorIdFromUrl) {
    doctorSelect.innerHTML = "";
    const label = DOCTORS[doctorIdFromUrl] || doctorIdFromUrl;
    const opt = document.createElement("option");
    opt.value = doctorIdFromUrl;
    opt.textContent = label;
    doctorSelect.appendChild(opt);
    doctorSelect.disabled = true;
  } else {
    doctorSelect.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "انتخاب کنید...";
    doctorSelect.appendChild(placeholder);

    Object.entries(DOCTORS).forEach(([id, label]) => {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = label;
      doctorSelect.appendChild(opt);
    });
  }

  // --- تابع اصلی: دریافت ساعت‌های خالی از Make ---
  async function fetchAvailableSlots(doctorId, selectedDate) {
      if (!doctorId || !selectedDate) return;

      // نمایش لودینگ
      timeGrid.innerHTML = '<div class="loading-text">⏳ در حال بررسی ظرفیت پزشک...</div>';
      hiddenTime.value = ""; // ریست کردن ساعت انتخابی قبلی

      try {
          // ارسال درخواست به Make
          // فرمت درخواست: URL?doctor_id=...&date=...
          const url = `${GET_SLOTS_URL}?doctor_id=${doctorId}&date=${selectedDate}`;
          const response = await fetch(url);
          
          if (!response.ok) throw new Error("Network error");
          
          const data = await response.json(); 
          // انتظار داریم دیتایی شبیه این بیاید:
          // { "slots": [ {"time": "10:00", "is_booked": true}, {"time": "11:00", "is_booked": false} ] }

          renderTimeButtons(data.slots);

      } catch (error) {
          console.error(error);
          timeGrid.innerHTML = '<div style="color:red; text-align:center;">خطا در دریافت ساعت‌ها. مجدد تلاش کنید.</div>';
      }
  }

  // --- ساخت دکمه‌ها بر اساس پاسخ Make ---
  function renderTimeButtons(slots) {
      timeGrid.innerHTML = ""; // پاک کردن لودینگ

      if (!slots || slots.length === 0) {
          timeGrid.innerHTML = '<div style="grid-column: span 2; text-align: center;">هیچ ساعتی تعریف نشده است.</div>';
          return;
      }

      slots.forEach(slot => {
          const btn = document.createElement("div");
          btn.className = "time-btn";
          btn.textContent = slot.time;
          btn.dataset.hour = slot.time; // ذخیره ساعت در اتریبیوت دیتا

          // بررسی وضعیت رزرو
          // طبق سناریوی قبلی، اگر is_booked برابر true باشد یعنی پر است
          if (slot.is_booked === true || slot.is_booked === "true") {
              btn.classList.add("disabled");
              btn.textContent += " (پر)";
          } else {
              // فقط اگر پر نبود، کلیک ایونت داشته باشد
              btn.onclick = () => selectTime(btn, slot.time);
          }

          timeGrid.appendChild(btn);
      });
  }

  function selectTime(btn, timeValue) {
      // حذف اکتیو از بقیه
      document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
      // فعال کردن دکمه کلیک شده
      btn.classList.add("active");
      // ست کردن مقدار در اینپوت مخفی
      hiddenTime.value = timeValue;
  }

  // --- راه‌اندازی تقویم شمسی ---
  $(function () {
    $("#date").persianDatepicker({
      format: "YYYY/MM/DD",
      initialValue: false,
      autoClose: true,
      persianDigit: false, // ارسال اعداد انگلیسی
      onSelect: function(unix) {
          // وقتی کاربر تاریخ را انتخاب کرد:
          // ۱. تاریخ فرمت شده را می‌گیریم (چون ممکنه هنوز توی اینپوت ننشسته باشه از کتابخونه می‌گیریم یا با یه تاخیر کوچیک)
          setTimeout(() => {
              const dateVal = $("#date").val();
              const docId = doctorSelect.value;
              // ۲. فراخوانی تابع دریافت ساعت‌ها
              fetchAvailableSlots(docId, dateVal);
          }, 100);
      }
    });
  });

  // --- اگر کاربر دکتر را دستی عوض کرد هم دوباره ساعت‌ها لود شود ---
  doctorSelect.addEventListener("change", () => {
      const dateVal = document.getElementById("date").value;
      if (dateVal) {
          fetchAvailableSlots(doctorSelect.value, dateVal);
      }
  });


  // --- ارسال فرم ثبت نهایی ---
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    if (!user) {
      statusDiv.textContent = "خطا: اطلاعات کاربر تلگرام دریافت نشد.";
      return;
    }

    if (!hiddenTime.value) {
      statusDiv.textContent = "لطفاً یک ساعت خالی را انتخاب کنید.";
      return;
    }

    const payload = {
      telegram_user: {
        id: user.id,
        username: user.username,
        first_name: user.first_name,
        last_name: user.last_name
      },
      patient: {
        full_name: form.full_name.value,
        national_id: form.national_id.value,
        phone: form.phone.value
      },
      appointment: {
        doctor_id: doctorSelect.value,
        doctor_name: DOCTORS[doctorSelect.value],
        date: form.date.value,
        time: hiddenTime.value,
        note: form.note.value
      },
      initData: tg.initData
    };

    const submitBtn = document.getElementById("submit-btn");
    submitBtn.textContent = "در حال ارسال...";
    submitBtn.disabled = true;
    statusDiv.textContent = "";

    try {
      const response = await fetch(MAKE_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        statusDiv.innerHTML = "<span style='color:#4caf50'>✅ نوبت شما با موفقیت ثبت شد.</span>";
        tg.HapticFeedback.notificationOccurred('success');
        setTimeout(() => tg.close(), 2000);
      } else {
        statusDiv.textContent = `❌ خطا در ثبت. کد: ${response.status}`;
        submitBtn.textContent = "ثبت نوبت";
        submitBtn.disabled
