
<!doctype html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>رزرو نوبت پزشکی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />

  <style>
    body {
      font-family: Vazirmatn, sans-serif;
      direction: rtl;
      background: #121212;
      color: #e6e6e6;
      padding: 20px;
      margin: 0;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
      color: #fff;
    }

    .container {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 0 16px rgba(0,0,0,0.4);
      max-width: 480px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 14px;
      color: #bdbdbd;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      outline: none;
      transition: 0.2s;
      box-sizing: border-box;
    }

    input[type="date"] {
      font-family: Vazirmatn, sans-serif;
      color-scheme: dark;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #6c63ff;
      background: #333;
    }

    button.primary {
      margin-top: 22px;
      padding: 12px;
      width: 100%;
      background: #6c63ff;
      border: none;
      color: white;
      font-size: 17px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button.primary:hover {
      background: #5a53e6;
    }

    button.primary:disabled {
        background: #444;
        cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      font-size: 15px;
      text-align: center;
      color: #90caf9;
      line-height: 1.6;
    }

    #user-info {
      text-align: center;
      margin-bottom: 10px;
      font-size: 16px;
      color: #eeeeee;
    }

    .hint {
      font-size: 12px;
      color: #9e9e9e;
      margin-top: 6px;
      line-height: 1.6;
    }

    /* --- Time buttons --- */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .time-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
      user-select: none;
      text-align: center;
    }

    .time-btn:hover {
      border-color: #6c63ff;
      background: #333;
    }

    .time-btn.active {
      background: rgba(108, 99, 255, 0.25);
      border-color: #6c63ff;
      box-shadow: 0 0 0 2px rgba(108,99,255,0.2) inset;
    }

    .time-btn.disabled {
        background: #3a1c1c;
        border-color: #552222;
        color: #777;
        cursor: not-allowed;
        pointer-events: none;
        text-decoration: line-through;
    }

    .loading-text {
        text-align: center;
        color: #ffa726;
        font-size: 14px;
        padding: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>رزرو نوبت</h2>
    <div id="user-info"></div>

    <form id="appointment-form">

      <label for="full_name">نام و نام خانوادگی</label>
      <input type="text" id="full_name" name="full_name" required />

      <label for="national_id">کد ملی</label>
      <input type="text" id="national_id" name="national_id" inputmode="numeric" maxlength="10" required />
      <div class="hint">۱۰ رقم، فقط عدد</div>

      <label for="phone">شماره تماس</label>
      <input type="tel" id="phone" name="phone" inputmode="tel" placeholder="09xxxxxxxxx" required />
      <div class="hint">مثال: 09123456789</div>

      <label for="doctor">پزشک</label>
      <select id="doctor" name="doctor" required>
        </select>

      <label for="date">تاریخ نوبت (میلادی)</label>
      <input
        type="date"
        id="date"
        name="date"
        required
      />
      <div class="hint">برای مشاهده ساعت‌های خالی، تاریخ را انتخاب کنید.</div>

      <label>ساعت نوبت</label>
      <div class="time-grid" id="time-grid">
         <div style="grid-column: span 2; text-align: center; color: #777;">
            ابتدا پزشک و تاریخ را انتخاب کنید.
         </div>
      </div>
      <div class="hint">ساعت‌های قرمز رنگ قبلاً رزرو شده‌اند.</div>

      <input type="hidden" id="time" name="time" required />

      <label for="note">توضیحات / علت مراجعه (اختیاری)</label>
      <textarea id="note" name="note" rows="3"></textarea>

      <button class="primary" type="submit" id="submit-btn">ثبت نوبت</button>
    </form>

    <div id="status"></div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  // ============================================
  // ⚠️ آدرس‌های وب‌هوک ⚠️
  // ============================================
  const MAKE_WEBHOOK_URL = 'https://hook.eu2.make.com/hhfl8sza59snc3al2zd9hygddpidleku';
  
  // آدرس وب‌هوک جدید (Get Slots) را اینجا قرار دهید:
  const GET_SLOTS_URL = 'https://hook.eu2.make.com/j78jo3phl99ov9vtwgg8r187nm95wiqd'; 
  
  // تنظیمات فرمت تاریخ برای دریافت ساعت‌ها
  // اگر خطای "pattern" می‌گیرید، فرمت را تغییر دهید:
  // 'sheet' = MM/DD/YYYY (فرمت گوگل شیت) - پیش‌فرض
  // 'iso' = YYYY-MM-DD (اگر make.com انتظار ISO دارد)
  // 'european' = DD/MM/YYYY
  const DATE_FORMAT_FOR_API = 'sheet'; // فرمت گوگل شیت: MM/DD/YYYY
  // اگر با 'sheet' کار نکرد، 'iso' را امتحان کنید
  
  // استفاده از POST برای جلوگیری از مشکل encode در URL
  // POST فعال است - تاریخ در body ارسال می‌شود
  const USE_POST_FOR_SLOTS = true;
  // ============================================

  const DOCTORS = {
    "dr_a": "دکتر A - مغز و اعصاب",
    "dr_b": "دکتر B - قلب و عروق",
    "dr_c": "دکتر C - داخلی",
  };

  const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
  const userInfoDiv = document.getElementById("user-info");
  const doctorSelect = document.getElementById("doctor");
  const form = document.getElementById("appointment-form");
  const statusDiv = document.getElementById("status");
  const timeGrid = document.getElementById("time-grid");
  const hiddenTime = document.getElementById("time");
  const dateInput = document.getElementById("date");

  // --- نمایش کاربر ---
  if (user) {
    userInfoDiv.textContent = `سلام ${user.first_name || ""} 👋`;
  } else {
    userInfoDiv.textContent = "در حال دریافت اطلاعات کاربر...";
  }

  // --- پر کردن لیست دکترها ---
  const urlParams = new URLSearchParams(window.location.search);
  const doctorIdFromUrl = urlParams.get("doctor_id");

  if (doctorIdFromUrl) {
    doctorSelect.innerHTML = "";
    const label = DOCTORS[doctorIdFromUrl] || doctorIdFromUrl;
    const opt = document.createElement("option");
    opt.value = doctorIdFromUrl;
    opt.textContent = label;
    doctorSelect.appendChild(opt);
    doctorSelect.disabled = true;
  } else {
    doctorSelect.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "انتخاب کنید...";
    doctorSelect.appendChild(placeholder);

    Object.entries(DOCTORS).forEach(([id, label]) => {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = label;
      doctorSelect.appendChild(opt);
    });
  }

  // 🔄 تابع تبدیل فرمت تاریخ به MM/DD/YYYY برای گوگل شیت
  function formatDateForSheet(isoDate) {
      if (!isoDate) return "";
      // ورودی: 2024-12-30
      const [year, month, day] = isoDate.split("-");
      // خروجی: 12/30/2024
      return `${month}/${day}/${year}`;
  }

  // 🔄 تابع تبدیل تاریخ به فرمت مورد نیاز API
  function formatDateForAPI(isoDate, format) {
      if (!isoDate) return "";
      const [year, month, day] = isoDate.split("-");
      
      switch(format) {
          case 'sheet':
              return `${month}/${day}/${year}`; // MM/DD/YYYY
          case 'european':
              return `${day}/${month}/${year}`; // DD/MM/YYYY
          case 'iso':
          default:
              return isoDate; // YYYY-MM-DD
      }
  }

  // --- تست یک فرمت تاریخ خاص ---
  async function tryFetchWithFormat(doctorId, rawDate, dateFormat, usePost) {
      const formattedDate = formatDateForAPI(rawDate, dateFormat);
      
      try {
          let response;
          
          if (usePost) {
              const requestBody = {
                  doctor_id: doctorId,
                  date: formattedDate
              };
              
              console.log(`  📤 POST با فرمت ${dateFormat}:`, formattedDate);
              response = await fetch(GET_SLOTS_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(requestBody)
              });
          } else {
              const url = `${GET_SLOTS_URL}?doctor_id=${encodeURIComponent(doctorId)}&date=${encodeURIComponent(formattedDate)}`;
              console.log(`  📤 GET با فرمت ${dateFormat}:`, url);
              response = await fetch(url);
          }
          
          // ابتدا پاسخ را به صورت text می‌خوانیم
          let responseText = await response.text();
          console.log(`  📥 پاسخ خام (${response.status}):`, responseText.substring(0, 500));
          
          if (!response.ok) {
              throw new Error(`HTTP ${response.status}: ${responseText.substring(0, 200)}`);
          }
          
          // --- تلاش برای اصلاح JSON خراب ---
          // 1. حذف کاراکترهای اضافی اول و آخر
          responseText = responseText.trim();
          
          // 2. تبدیل None به null (اگر وجود داشته باشد)
          if (responseText.includes('None')) {
              console.warn("  ⚠️ پاسخ حاوی 'None' است، تبدیل به 'null'...");
              responseText = responseText.replace(/: ?None/g, ': null');
          }
          
          // 3. اصلاح مشکل چسبیدن آبجکت‌ها (مثلاً }{ -> }, {)
          // این مشکل در make.com رایج است وقتی از Iterator بدون Array Aggregator استفاده می‌شود
          if (responseText.includes('}{')) {
              console.warn("  ⚠️ پاسخ حاوی آبجکت‌های چسبیده است، اصلاح...");
              responseText = responseText.replace(/}\s*{/g, '}, {');
          }
          if (responseText.includes('}\n{')) {
            responseText = responseText.replace(/}\s*\n\s*{/g, '}, {');
          }

          // 4. اگر پاسخ با [ شروع نمی‌شود ولی شبیه آبجکت است، آن را در آرایه می‌گذاریم
          if (responseText.startsWith('{') && responseText.endsWith('}')) {
              // چک کنیم شاید چند آبجکت با ویرگول جدا شده‌اند ولی در براکت نیستند
              // یا شاید فقط یک آبجکت است
              if (!responseText.startsWith('[')) {
                   console.warn("  ⚠️ پاسخ در آرایه نیست، افزودن []...");
                   responseText = `[${responseText}]`;
              }
          }
          
          // سعی می‌کنیم JSON اصلاح شده را parse کنیم
          let data;
          try {
              data = JSON.parse(responseText);
          } catch (parseError) {
              console.error("  ❌ خطای JSON Parse:", parseError.message);
              console.error("  📄 محتوای نامعتبر:", responseText);
              
              throw new Error(`فرمت JSON نامعتبر است (خطا در کاراکتر ${parseError.message.match(/\d+/)}). محتوا: ${responseText.substring(0, 100)}...`);
          }
          
          // بررسی ساختار داده
          let slots = null;
          
          if (Array.isArray(data)) {
              slots = data; // پاسخ مستقیم یک آرایه است
          } else if (data.slots && Array.isArray(data.slots)) {
              slots = data.slots;
          } else if (data.data && Array.isArray(data.data)) {
              slots = data.data;
          } else if (data.items && Array.isArray(data.items)) {
              slots = data.items;
          } else if (data.result && Array.isArray(data.result)) {
              slots = data.result;
          } else {
              // اگر هیچ آرایه‌ای پیدا نشد، کل data را امتحان می‌کنیم
              console.warn("  ⚠️ ساختار پاسخ نامشخص:", data);
              throw new Error(`ساختار پاسخ نامعتبر. انتظار آرایه slots. دریافت: ${JSON.stringify(data).substring(0, 200)}`);
          }
          
          if (Array.isArray(slots) && slots.length > 0) {
              console.log(`  ✅ موفق! ${slots.length} slot پیدا شد`);
              return { success: true, slots: slots, format: dateFormat };
          } else if (Array.isArray(slots)) {
              console.log(`  ⚠️ آرایه خالی است`);
              return { success: true, slots: [], format: dateFormat };
          }
          
          throw new Error("پاسخ معتبر نیست - slots یک آرایه نیست");
      } catch (error) {
          console.error(`  ❌ خطا با فرمت ${dateFormat}:`, error.message);
          return { success: false, error: error.message, format: dateFormat };
      }
  }

  // --- دریافت ساعت‌ها با تست خودکار فرمت‌های مختلف ---
  async function fetchAvailableSlots(doctorId, rawDate) {
      if (!doctorId || !rawDate) return;

      timeGrid.innerHTML = '<div class="loading-text">⏳ در حال بررسی ظرفیت پزشک...</div>';
      hiddenTime.value = "";

      console.log("=== شروع دریافت ساعت‌ها ===");
      console.log("تاریخ ورودی (ISO):", rawDate);
      console.log("Doctor ID:", doctorId);

      try {
          // ابتدا فرمت پیش‌فرض را امتحان می‌کنیم
          let result = await tryFetchWithFormat(doctorId, rawDate, DATE_FORMAT_FOR_API, USE_POST_FOR_SLOTS);
          
          if (result.success) {
              console.log("✅ موفق با فرمت:", result.format);
              renderTimeButtons(result.slots);
              return;
          }
          
          console.warn("❌ فرمت پیش‌فرض کار نکرد:", result.error);
          console.log("🔄 تست فرمت‌های دیگر...");
          
          // اگر کار نکرد، فرمت‌های دیگر را تست می‌کنیم
          const formatsToTry = [
              { format: 'iso', post: true },
              { format: 'iso', post: false },
              { format: 'sheet', post: true },
              { format: 'sheet', post: false },
              { format: 'european', post: true }
          ];
          
          for (const test of formatsToTry) {
              if (test.format === DATE_FORMAT_FOR_API && test.post === USE_POST_FOR_SLOTS) {
                  continue; // قبلاً تست شده
              }
              
              console.log(`تست فرمت: ${test.format}, POST: ${test.post}`);
              result = await tryFetchWithFormat(doctorId, rawDate, test.format, test.post);
              
              if (result.success) {
                  console.log(`✅ موفق با فرمت: ${result.format}, POST: ${test.post}`);
                  renderTimeButtons(result.slots);
                  return;
              }
              
              console.warn(`❌ فرمت ${test.format} کار نکرد:`, result.error);
          }
          
          // اگر هیچ فرمتی کار نکرد
          throw new Error(`همه فرمت‌ها تست شدند اما هیچ کدام کار نکرد. آخرین خطا: ${result.error}`);
          
      } catch (error) {
          console.error("=== خطای نهایی ===", error);
          const errorMsg = error.message || "خطای نامشخص";
          
          // نمایش خطای کامل برای دیباگ
          timeGrid.innerHTML = `<div style="color:red; text-align:center; padding:15px; background:#2a1a1a; border-radius:10px; margin:10px 0;">
              <div style="font-size:18px; margin-bottom:10px;">❌ خطا در دریافت ساعت‌ها</div>
              <div style="font-size:13px; color:#ff9999; margin-bottom:10px;">${errorMsg}</div>
              <div style="font-size:11px; color:#999; margin-top:10px;">
                  💡 Console را باز کنید (F12) برای جزئیات بیشتر
              </div>
          </div>`;
      }
  }

  // --- رندر کردن دکمه‌ها ---
  function renderTimeButtons(slots) {
      timeGrid.innerHTML = "";
      if (!slots || slots.length === 0) {
          timeGrid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #777;">هیچ ساعتی تعریف نشده است.</div>';
          return;
      }

      slots.forEach(slot => {
          const btn = document.createElement("div");
          btn.className = "time-btn";
          
          // بررسی وجود فیلد time در slot
          const timeValue = slot.time || slot.hour || slot.slot || "";
          if (!timeValue) {
              console.warn("Slot بدون time:", slot);
              return; // رد کردن slot های بدون time
          }
          
          btn.textContent = timeValue;
          btn.dataset.hour = timeValue;

          // بررسی وضعیت رزرو (پشتیبانی از فرمت‌های مختلف)
          const isBooked = slot.is_booked === true || 
                          slot.is_booked === "true" || 
                          slot.is_booked === 1 ||
                          slot.booked === true ||
                          slot.booked === "true";

          if (isBooked) {
              btn.classList.add("disabled");
              btn.textContent += " (پر)";
          } else {
              btn.onclick = () => selectTime(btn, timeValue);
          }
          timeGrid.appendChild(btn);
      });
  }

  function selectTime(btn, timeValue) {
      document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      hiddenTime.value = timeValue;
  }

  // --- تریگر کردن تغییرات ---
  dateInput.addEventListener("change", function() {
      // اینپوت مقدار را به صورت YYYY-MM-DD برمی‌گرداند
      const rawDate = this.value; 
      const docId = doctorSelect.value;
      if (docId && rawDate) {
          fetchAvailableSlots(docId, rawDate);
      }
  });

  doctorSelect.addEventListener("change", () => {
      const rawDate = dateInput.value;
      if (rawDate) {
          fetchAvailableSlots(doctorSelect.value, rawDate);
      }
  });

  // --- ارسال فرم ---
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    if (!user) {
      statusDiv.textContent = "خطا: اطلاعات کاربر تلگرام دریافت نشد.";
      return;
    }

    if (!hiddenTime.value) {
      statusDiv.textContent = "لطفاً ساعت نوبت را انتخاب کنید.";
      return;
    }

    // تبدیل تاریخ برای ذخیره نهایی در شیت
    const finalDate = formatDateForSheet(form.date.value);

    const payload = {
      telegram_user: {
        id: user.id,
        username: user.username,
        first_name: user.first_name,
        last_name: user.last_name
      },
      patient: {
        full_name: form.full_name.value,
        national_id: form.national_id.value,
        phone: form.phone.value
      },
      appointment: {
        doctor_id: doctorSelect.value,
        doctor_name: DOCTORS[doctorSelect.value],
        date: finalDate, // اینجا تاریخ به صورت MM/DD/YYYY ارسال می‌شود
        time: hiddenTime.value,
        note: form.note.value
      },
      initData: tg.initData
    };

    const submitBtn = document.getElementById("submit-btn");
    submitBtn.textContent = "در حال ارسال...";
    submitBtn.disabled = true;
    statusDiv.textContent = "";

    try {
      const response = await fetch(MAKE_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        statusDiv.innerHTML = "<span style='color:#4caf50'>✅ نوبت شما ثبت شد.</span>";
        tg.HapticFeedback.notificationOccurred('success');
        setTimeout(() => tg.close(), 2000);
      } else {
        statusDiv.textContent = `❌ خطا در ثبت. کد: ${response.status}`;
        submitBtn.textContent = "ثبت نوبت";
        submitBtn.disabled = false;
      }

    } catch (err) {
      console.error(err);
      statusDiv.textContent = "❌ خطای اتصال.";
      submitBtn.textContent = "ثبت نوبت";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
